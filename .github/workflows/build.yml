name: Build Unsigned IPA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml --project DietTracker.xcodeproj

      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project DietTracker.xcodeproj \
            -scheme DietTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package Payload into unsigned .ipa
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/DietTracker.app"
          if [ ! -d "$APP" ]; then
            echo "::error::App bundle not found at $APP"
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload \( -name '._*' -o -name '.DS_Store' \) -delete
          rm -rf "Payload/DietTracker.app/_CodeSignature"
          zip -qryX "DietTracker-unsigned.ipa" Payload
          rm -rf Payload
          
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DietTracker-unsigned-ipa
          path: DietTracker-unsigned.ipa
          if-no-files-found: error
          retention-days: 90
